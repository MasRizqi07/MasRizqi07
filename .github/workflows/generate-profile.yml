name: Generate Profile Cards

on:
  schedule:
    - cron: "0 20 * * *"   # 03:00 WIB every day
  workflow_dispatch: {}     # allows manual "Run workflow" button
  push:
    branches: [main]
    paths:
      - "scripts/generate-profile-card.mjs"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate SVG cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-profile-card.mjs

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/system-info.svg assets/stats-bricks.svg assets/projects-grid.svg
          git diff --cached --quiet || git commit -m "chore: refresh profile cards [skip ci]"
          git push
